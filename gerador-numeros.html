<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Números Aleatórios — ellerio</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte escura.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra Superior Horizontal Liquid Glass -->
  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="brand">
        <img src="images/fundo transparente fonte escura.png" alt="ellerio logo" class="logo logo-dark">
        <img src="images/fundo transparente fonte clara.png" alt="ellerio logo" class="logo logo-light">
      </a>

      <div class="nav-actions">
        <a href="index.html" class="nav-back">← Voltar</a>
        <button id="themeToggle" class="theme-btn" aria-label="Alternar tema">
          <span class="theme-icon">◐</span>
          <span class="theme-label">Tema</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-wrapper">
      <div class="tool-header">
        <span class="badge">Ferramenta</span>
        <h1>Gerador de Números Aleatórios</h1>
        <p class="hero-desc">Realize sorteios, gere números para rifas, jogos ou testes com intervalo configurável.</p>
      </div>

      <!-- Caixa Principal de Configuração -->
      <div class="generator-box">
        <!-- Campos de Configuração -->
        <div class="rng-inputs-grid">
          <div class="input-group">
            <label for="quantityInput">Quantidade de números</label>
            <input type="number" id="quantityInput" min="1" max="100" value="1">
          </div>
          <div class="input-group">
            <label for="minInput">Número Mínimo</label>
            <input type="number" id="minInput" value="1">
          </div>
          <div class="input-group">
            <label for="maxInput">Número Máximo</label>
            <input type="number" id="maxInput" value="100">
          </div>
        </div>

        <!-- Opção de não repetir -->
        <div class="options-row" style="margin-top: 18px; margin-bottom: 24px;">
          <label class="checkbox-label">
            <input type="checkbox" id="noRepeatCheckbox" checked>
            <span>Não permitir números repetidos</span>
          </label>
        </div>

        <!-- Área onde os números sorteados aparecem -->
        <div class="rng-results-container" id="resultsContainer">
          <div class="rng-badge-number">?</div>
        </div>

        <!-- Botões de Ação -->
        <div class="footer-buttons" style="margin-top: 24px;">
          <button class="btn-copy" onclick="drawNumbers()">Sortear Números</button>
          <button class="btn-clear" onclick="copyResults()">Copiar Resultado</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; ellerio. Feito para ser rápido e direto.</p>
  </footer>

  <div id="toast" class="toast">Resultado copiado!</div>

  <!-- Script da Ferramenta -->
  <script>
    let lastResults = [];

    function drawNumbers() {
      const qty = parseInt(document.getElementById('quantityInput').value, 10);
      const min = parseInt(document.getElementById('minInput').value, 10);
      const max = parseInt(document.getElementById('maxInput').value, 10);
      const noRepeat = document.getElementById('noRepeatCheckbox').checked;
      const container = document.getElementById('resultsContainer');

      if (isNaN(qty) || isNaN(min) || isNaN(max)) {
        alert('Por favor, preencha todos os campos com valores válidos.');
        return;
      }

      if (min >= max) {
        alert('O número mínimo deve ser menor que o número máximo.');
        return;
      }

      if (qty < 1 || qty > 200) {
        alert('A quantidade deve ser entre 1 e 200.');
        return;
      }

      const availableRange = (max - min) + 1;
      if (noRepeat && qty > availableRange) {
        alert(`Não é possível sortear ${qty} números sem repetição em um intervalo de ${availableRange} opções.`);
        return;
      }

      const results = [];

      if (noRepeat) {
        const pool = [];
        for (let i = min; i <= max; i++) pool.push(i);
        // Algoritmo Fisher-Yates shuffle
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        for (let i = 0; i < qty; i++) {
          results.push(pool[i]);
        }
      } else {
        for (let i = 0; i < qty; i++) {
          const num = Math.floor(Math.random() * (max - min + 1)) + min;
          results.push(num);
        }
      }

      lastResults = results;
      renderResults(results);
    }

    function renderResults(list) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      list.forEach(num => {
        const span = document.createElement('div');
        span.className = 'rng-badge-number';
        span.textContent = num;
        container.appendChild(span);
      });
    }

    async function copyResults() {
      if (!lastResults.length) {
        drawNumbers();
      }
      try {
        await navigator.clipboard.writeText(lastResults.join(', '));
        showToast('Números copiados com sucesso!');
      } catch (e) {
        showToast('Falha ao copiar.');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // Gerenciador do Tema Claro/Escuro
    const themeBtn = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('ellerio-theme') || 'light';
    html.setAttribute('data-theme', savedTheme);

    themeBtn.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('ellerio-theme', newTheme);
    });

    // Sorteia um inicial ao carregar
    window.addEventListener('DOMContentLoaded', drawNumbers);
  </script>

  <!-- Tag de Anúncio Monetag -->
  <script>(function(s){s.dataset.zone='11768463',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
