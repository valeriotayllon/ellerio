<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de CNH — ellerio</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte escura.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="brand">
        <img src="images/fundo transparente fonte escura.png" alt="ellerio logo" class="logo logo-dark">
        <img src="images/fundo transparente fonte clara.png" alt="ellerio logo" class="logo logo-light">
      </a>
      <div class="nav-actions">
        <a href="index.html" class="nav-back">← Voltar</a>
        <button id="themeToggle" class="theme-btn" aria-label="Alternar tema">
          <span class="theme-icon">◐</span>
          <span class="theme-label">Tema</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-wrapper">
      <div class="tool-header">
        <span class="badge">Ferramenta</span>
        <h1>Gerador de CNH</h1>
        <p class="hero-desc">Gere números de Carteira Nacional de Habilitação (CNH) válidos para testes cadastrais.</p>
      </div>

      <div class="generator-box">
        
        <div class="display-cpf" id="cnhDisplay">00000000000</div>

        <div class="footer-buttons">
          <button class="btn-copy" onclick="generateCNH()">Gerar Nova CNH</button>
          <button class="btn-clear" onclick="copyCNH()">Copiar CNH</button>
        </div>
        <p class="tool-disclaimer" style="margin-top:20px;">* Gera números calculados segundo a regra oficial dos 11 dígitos da CNH do Detran/Denatran.</p>
    
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; ellerio. Feito para ser rápido e direto.</p>
  </footer>

  <div id="toast" class="toast">Copiado com sucesso!</div>

  <script>
    function showToast(msg = 'Copiado com sucesso!') {
      const t = document.getElementById('toast');
      if (t) {
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2000);
      }
    }
  </script>
  
    <script>
      function generateCNH() {
        const d = Array.from({length: 9}, () => Math.floor(Math.random() * 10));
        let sum = 0;
        for (let i = 0; i < 9; i++) {
          sum += d[i] * (9 - i);
        }
        let d1 = sum % 11;
        let inc = 0;
        if (d1 >= 10) {
          d1 = 0;
          inc = 2;
        }

        sum = 0;
        for (let i = 0; i < 9; i++) {
          sum += d[i] * (1 + i);
        }
        let d2 = (sum % 11);
        if (d2 >= 10) {
          d2 = 0;
        } else {
          d2 = d2 - inc;
          if (d2 < 0) d2 += 11;
        }

        const cnh = d.join('') + d1.toString() + d2.toString();
        document.getElementById('cnhDisplay').innerText = cnh;
      }
      async function copyCNH() {
        await navigator.clipboard.writeText(document.getElementById('cnhDisplay').innerText);
        showToast('CNH copiada!');
      }
      window.addEventListener('DOMContentLoaded', generateCNH);
    </script>
    
  
  <script>
    const themeBtn = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('ellerio-theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('ellerio-theme', newTheme);
      });
    }
  </script>
  <script>(function(s){s.dataset.zone='11768463',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
</html>
