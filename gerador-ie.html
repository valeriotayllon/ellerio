<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Inscrição Estadual — ellerio</title>
  <link rel="icon" type="image/png" href="images/fundo transparente fonte escura.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="brand">
        <img src="images/fundo transparente fonte escura.png" alt="ellerio logo" class="logo logo-dark">
        <img src="images/fundo transparente fonte clara.png" alt="ellerio logo" class="logo logo-light">
      </a>
      <div class="nav-actions">
        <a href="index.html" class="nav-back">← Voltar</a>
        <button id="themeToggle" class="theme-btn" aria-label="Alternar tema">
          <span class="theme-icon">◐</span>
          <span class="theme-label">Tema</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="tool-wrapper">
      <div class="tool-header">
        <span class="badge">Ferramenta</span>
        <h1>Gerador de Inscrição Estadual</h1>
        <p class="hero-desc">Gere números de Inscrição Estadual (IE) calculados para empresas em diferentes estados.</p>
      </div>

      <div class="generator-box">
        
        <div class="display-cpf" id="ieDisplay">000.000.000.000</div>
        
        <div class="options-row" style="width: 100%; max-width: 320px; margin: 16px auto;">
          <div class="input-group" style="width: 100%;">
            <label>Selecione o Estado (UF)</label>
            <select id="ufSelect" onchange="generateIE()" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--textarea-bg); color: var(--text-main); font-size: 1rem; outline: none;">
              <option value="SP">São Paulo (SP)</option>
              <option value="RJ">Rio de Janeiro (RJ)</option>
              <option value="MG">Minas Gerais (MG)</option>
              <option value="RS">Rio Grande do Sul (RS)</option>
              <option value="PR">Paraná (PR)</option>
              <option value="CE">Ceará (CE)</option>
              <option value="BA">Bahia (BA)</option>
            </select>
          </div>
        </div>

        <div class="footer-buttons">
          <button class="btn-copy" onclick="generateIE()">Gerar Inscrição Estadual</button>
          <button class="btn-clear" onclick="copyIE()">Copiar IE</button>
        </div>
    
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; ellerio. Feito para ser rápido e direto.</p>
  </footer>

  <div id="toast" class="toast">Copiado com sucesso!</div>

  <script>
    function showToast(msg = 'Copiado com sucesso!') {
      const t = document.getElementById('toast');
      if (t) {
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2000);
      }
    }
  </script>
  
    <script>
      function generateIE() {
        const uf = document.getElementById('ufSelect').value;
        const rnd = () => Math.floor(Math.random() * 10);
        let ie = "";

        if (uf === 'SP') {
          // 12 dígitos com pesos
          const d = Array.from({length: 8}, () => rnd());
          const w1 = [1, 3, 4, 5, 6, 7, 8, 10];
          let s1 = d.reduce((acc, v, i) => acc + v * w1[i], 0);
          let d1 = (s1 % 11) % 10;
          d.push(d1);
          d.push(rnd(), rnd());
          const w2 = [3, 2, 10, 9, 8, 7, 6, 5, 4, 3, 2];
          let s2 = d.reduce((acc, v, i) => acc + v * w2[i], 0);
          let d2 = (s2 % 11) % 10;
          d.push(d2);
          ie = d.join('').replace(/^(\d{3})(\d{3})(\d{3})(\d{3})$/, '$1.$2.$3.$4');
        } else if (uf === 'RJ') {
          const d = [rnd() || 1].concat(Array.from({length: 6}, () => rnd()));
          const w = [2, 7, 6, 5, 4, 3, 2];
          let s = d.reduce((acc, v, i) => acc + v * w[i], 0);
          let rem = s % 11;
          let dig = rem <= 1 ? 0 : 11 - rem;
          d.push(dig);
          ie = d.join('').replace(/^(\d{2})(\d{3})(\d{3})$/, '$1.$2.$3');
        } else {
          // Padrão genérico de 9 a 10 dígitos para os outros estados
          const d = Array.from({length: 8}, () => rnd());
          const s = d.reduce((acc, v, i) => acc + v * (9 - i), 0);
          const dig = (11 - (s % 11)) % 10;
          d.push(dig);
          ie = d.join('').replace(/^(\d{3})(\d{3})(\d{3})$/, '$1.$2.$3');
        }

        document.getElementById('ieDisplay').innerText = ie;
      }
      async function copyIE() {
        await navigator.clipboard.writeText(document.getElementById('ieDisplay').innerText);
        showToast('Inscrição Estadual copiada!');
      }
      window.addEventListener('DOMContentLoaded', generateIE);
    </script>
    
  
  <script>
    const themeBtn = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('ellerio-theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('ellerio-theme', newTheme);
      });
    }
  </script>
  <script>(function(s){s.dataset.zone='11768463',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
</html>
